plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://cursemaven.com" }
	maven { url "https://maven.ryanliptak.com/" }
	maven { url = uri("https://storage.googleapis.com/devan-maven/") }
	maven { url "https://maven.siphalor.de" }
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Config
	modImplementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
    	exclude(group: "net.fabricmc.fabric-api")
  	}
	// Modmenu
	modCompileOnly modRuntimeOnly ("com.terraformersmc:modmenu:${project.mod_menu_version}"), {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Fabric Seasons
	modCompileOnly ('maven.modrinth:fabric-seasons:2.3+1.20') {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc.fabric-loader")
	}
	// Serene Seasons
    modCompileOnly modRuntimeOnly ('maven.modrinth:serene-seasons:qsbPIZeU') {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc.fabric-loader")
	}
	// AppleSkin
	modCompileOnly ('maven.modrinth:appleskin:fG1xJao0') {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Farmers Delight
	modCompileOnly ('maven.modrinth:farmers-delight-refabricated:1.20.1-2.1.3') {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc.fabric-loader")
	}
	// Expanded Delight
	modCompileOnly ('maven.modrinth:expanded-delight:0.3.1') {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc.fabric-loader")
	}
	// Vinery
	modCompileOnly ('maven.modrinth:lets-do-vinery:xXv88P3U') {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc.fabric-loader")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
